name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install --require-hashes -r papermind/requirements.lock
      - run: python scripts/test_backend_isolated.py
      - run: python scripts/smoke_backend.py
      # Includes license presence. History review and publication approval remain manual.
      - run: python scripts/check_public_release.py
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm test && npm run build && npm run lint
        working-directory: web
      - run: npm audit --audit-level=high
        working-directory: web
      # Ubuntu's existing AppArmor profile covers the preinstalled stable Chrome.
      # Keep chromiumSandbox enabled; do not relax the host's userns policy.
      - run: test -x /opt/google/chrome/chrome
      - run: npm run test:pdf-reader
        working-directory: web
        env:
          PAPERMIND_CHROMIUM_EXECUTABLE: /opt/google/chrome/chrome
